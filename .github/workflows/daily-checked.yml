name: Daily checked-date stamp

# Updates the "Last checked" date on every page once per day and commits the
# change. Publishing to production is handled separately by deploy.yml, whose
# 05:30 UTC scheduled run carries this stamp to the live Worker.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Skip a late GitHub `schedule:` run when the Cloudflare scheduler
  # (worker/scheduler.ts) already dispatched this workflow on time.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" \
                -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 --jq .total_count || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already dispatched in the last 12 h ($n run(s)) — skipping late scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch — running as fallback."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  stamp:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update checked dates
        run: node scripts/update-checked-date.mjs

      - name: Commit if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily checked-date stamp [skip ci]"
            git push
          fi
