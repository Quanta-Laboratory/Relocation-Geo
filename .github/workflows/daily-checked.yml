name: Daily checked-date stamp

# Updates the "Last checked" date on every page once per day and commits the
# change. Publishing to production is handled separately by deploy.yml, whose
# 05:30 UTC scheduled run carries this stamp to the live Worker.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update checked dates
        run: node scripts/update-checked-date.mjs

      - name: Commit if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily checked-date stamp [skip ci]"
            git push
          fi
