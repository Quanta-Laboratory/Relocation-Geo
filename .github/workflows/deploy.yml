name: Deploy to Cloudflare Workers

# Publishes the site to production (Worker "relocation1v").
#
# Triggers:
#   - push to main        → deploy immediately after a human push.
#   - daily schedule      → 05:30 UTC, right after the "daily checked-date stamp"
#                           (05:00 UTC). The bot's stamp commits carry [skip ci],
#                           so a push event does NOT fire for them — this daily
#                           run is what carries the fresh date to production.
#   - manual dispatch     → deploy on demand from the Actions tab.
#
# Requires ONE repository secret:
#   CLOUDFLARE_API_TOKEN  — a Cloudflare API token with "Edit Cloudflare Workers"
#                           permission on the Dev@quanta.ge account.
# The account id is in wrangler.jsonc; the worker's ANTHROPIC_API_KEY secret is
# set on the Worker itself and is untouched by deploys.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC — after the daily checked-date stamp
  workflow_dispatch: {}

# Never run two production deploys at once; a newer one supersedes an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip a late GitHub `schedule:` run when the Cloudflare scheduler
  # (worker/scheduler.ts) already dispatched this workflow on time.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" \
                -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 --jq .total_count || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already dispatched in the last 12 h ($n run(s)) — skipping late scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch — running as fallback."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler v4 requires Node.js >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pin to a v4 wrangler: the action's default (3.90.0) predates
          # wrangler.jsonc (JSON config) support, so it can't read `main`.
          wranglerVersion: '4.114.0'
          command: deploy
