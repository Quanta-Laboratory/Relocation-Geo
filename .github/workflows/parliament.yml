name: Parliament Monitor

on:
  schedule:
    # Daily. Times are UTC (GitHub cron is always UTC).
    # 07:00 UTC = 11:00 Tbilisi.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parliament-monitor
  cancel-in-progress: false

jobs:
  parliament:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parliament monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/matsne_monitor/parliament_monitor.py

      - name: Commit state and log if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/parliament_state.json 2>/dev/null || true
          git add scripts/matsne_monitor/parliament_log.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: parliament monitor update [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
