name: Daily GA4 analytics to Telegram

# Posts yesterday's GA4 traffic summary to a Telegram chat once per day.
# Requires repository secrets: GA4_PROPERTY_ID, GA_SERVICE_ACCOUNT_JSON,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (~10:00 Tbilisi)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Skip a late GitHub `schedule:` run when the Cloudflare scheduler
  # (worker/scheduler.ts) already dispatched this workflow on time.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" \
                -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 --jq .total_count || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already dispatched in the last 12 h ($n run(s)) — skipping late scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch — running as fallback."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send GA4 report to Telegram
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/ga4-telegram-report.mjs
