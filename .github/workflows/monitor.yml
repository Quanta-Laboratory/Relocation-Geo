name: Matsne Monitor

on:
  schedule:
    # Twice daily. Times are UTC (GitHub cron is always UTC).
    # 08:00 UTC = 12:00 Tbilisi, 16:00 UTC = 20:00 Tbilisi.
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a SAMPLE alert — newest matsne doc — to Telegram, then exit'
        type: boolean
        default: false
      today_list:
        description: 'Send a LIST of all documents published today to Telegram, then exit'
        type: boolean
        default: false
      sample_impact:
        description: 'Send a DEMO impact alert (with buttons) to Telegram, then exit'
        type: boolean
        default: false
      relevance_backtest:
        description: 'Score the last N logged documents with the relevance filter and send a summary (e.g. 40); empty = normal run'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: matsne-monitor
  cancel-in-progress: false

jobs:
  # Skip a late GitHub `schedule:` run when the Cloudflare scheduler
  # (worker/scheduler.ts) already dispatched this workflow on time.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" \
                -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 --jq .total_count || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already dispatched in the last 12 h ($n run(s)) — skipping late scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch — running as fallback."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  monitor:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Demo impact alert
        if: github.event.inputs.sample_impact == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/matsne_monitor/impact.py --sample

      - name: Run monitor
        if: github.event.inputs.sample_impact != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram }}
          TODAY_LIST: ${{ github.event.inputs.today_list }}
          RELEVANCE_BACKTEST: ${{ github.event.inputs.relevance_backtest }}
        run: |
          if [ -n "$RELEVANCE_BACKTEST" ]; then
            cd scripts/matsne_monitor && python relevance.py --backtest "$RELEVANCE_BACKTEST"
          else
            python scripts/matsne_monitor/monitor.py
          fi

      - name: Commit state and log if changed
        if: github.event.inputs.sample_impact != 'true'
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/state.json 2>/dev/null || true
          git add scripts/matsne_monitor/changes_log.md 2>/dev/null || true
          git add scripts/matsne_monitor/watchlist_state.json 2>/dev/null || true
          git add scripts/matsne_monitor/topics_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: matsne monitor update [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      # Relevance filter → proposed edits → PR → Telegram with ✅/❌ buttons.
      # Runs after the state commit so the PR branches start from fresh main.
      - name: Impact analysis (relocation.ge pages)
        if: github.event.inputs.test_telegram != 'true' && github.event.inputs.today_list != 'true' && github.event.inputs.sample_impact != 'true' && github.event.inputs.relevance_backtest == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/matsne_monitor/impact.py
          git add scripts/matsne_monitor/impact_log.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: matsne impact log [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
