name: Matsne Monitor

on:
  schedule:
    # Twice daily. Times are UTC (GitHub cron is always UTC).
    # 08:00 UTC = 12:00 Tbilisi, 16:00 UTC = 20:00 Tbilisi.
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a test Telegram message and exit (checks delivery)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: matsne-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram }}
        run: python scripts/matsne_monitor/monitor.py

      - name: Commit state and log if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/state.json 2>/dev/null || true
          git add scripts/matsne_monitor/changes_log.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: matsne monitor update [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
