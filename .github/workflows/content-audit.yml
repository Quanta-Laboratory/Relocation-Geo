name: Content audit

# Checks every guide against the legal acts logged by the matsne monitor and
# reports outdated pages to Telegram with "Prepare edit" buttons.
# Read-only for content: writes only the report (scripts/edits/audits/).

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Only documents logged on/after this date (YYYY-MM-DD); empty = all history'
        required: false
        default: ''
      resend:
        description: 'Only resend outdated findings to Telegram (no audit)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Audit
        env:
          AUDIT_SINCE: ${{ github.event.inputs.since }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.resend }}" = "true" ]; then python scripts/edits/resend_findings.py; else python scripts/edits/audit.py; fi
      - name: Commit report
        if: always()
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/edits/audits 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: content audit report [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
