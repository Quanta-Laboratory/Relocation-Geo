name: Matsne Daily Digest

on:
  schedule:
    # 17:00 UTC = 21:00 Tbilisi. Runs after the day's monitor runs.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled = since previous digest (advances watermark); manual = last N days'
        type: choice
        options: [manual, scheduled]
        default: manual
      digest_days:
        description: 'Manual mode: window in days of 24 h (1 = last 24 h; 7 = last week)'
        type: string
        default: '1'
      relevant_only:
        description: 'Only relocation-relevant items (immigration, work, tax, residence)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: matsne-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.mode || 'manual' }}
          DIGEST_DAYS: ${{ github.event.inputs.digest_days || '1' }}
          RELEVANT_ONLY: ${{ github.event.inputs.relevant_only == 'true' && '1' || '0' }}
        run: python scripts/matsne_monitor/digest.py

      - name: Commit digest watermark if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/digest_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: matsne digest watermark [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
