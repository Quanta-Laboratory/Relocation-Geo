name: Sync Worker secrets

# Copies secrets from GitHub Actions into the Cloudflare Worker (relocation1v),
# so a key never has to be pasted by hand into the Cloudflare dashboard.
# Run manually: Actions → Sync Worker secrets → Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Put ANTHROPIC_API_KEY into the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "GitHub secret ANTHROPIC_API_KEY is empty"; exit 1; }
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.114.0 secret put ANTHROPIC_API_KEY

      # ---- Telegram buttons for matsne impact alerts (worker/telegram.ts) ----
      # `if: always()` so these still run when the Anthropic step above fails.

      - name: Put Telegram + GitHub content token into the Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          GH_CONTENT_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "GitHub secret TELEGRAM_BOT_TOKEN is empty"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID"   || { echo "GitHub secret TELEGRAM_CHAT_ID is empty"; exit 1; }
          W="npx --yes wrangler@4.114.0"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | $W secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID"   | $W secret put TELEGRAM_CHAT_ID
          # Optional: comma-separated Telegram user ids allowed to press the buttons.
          if [ -n "$TELEGRAM_ADMIN_IDS" ]; then printf '%s' "$TELEGRAM_ADMIN_IDS" | $W secret put TELEGRAM_ADMIN_IDS; fi
          # Optional: PAT with Contents RW + Pull requests RW. Without it the Worker
          # falls back to GH_DISPATCH_TOKEN (which then needs those permissions).
          if [ -n "$GH_CONTENT_TOKEN" ]; then printf '%s' "$GH_CONTENT_TOKEN" | $W secret put GH_CONTENT_TOKEN; fi

      - name: Register Telegram webhook (fresh secret every run)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "GitHub secret TELEGRAM_BOT_TOKEN is empty"; exit 1; }
          SECRET=$(openssl rand -hex 32)
          printf '%s' "$SECRET" | npx --yes wrangler@4.114.0 secret put TELEGRAM_WEBHOOK_SECRET
          # Give the Worker a moment to pick up the new secret.
          sleep 10
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            -d "{\"url\":\"https://relocation.ge/api/telegram\",\"secret_token\":\"${SECRET}\",\"allowed_updates\":[\"callback_query\"],\"drop_pending_updates\":true}" \
            | grep -q '"ok":true' && echo "Webhook set." || { echo "setWebhook failed"; exit 1; }
