name: Sync Worker secrets

# Copies secrets from GitHub Actions into the Cloudflare Worker (relocation1v),
# so a key never has to be pasted by hand into the Cloudflare dashboard.
# Run manually: Actions → Sync Worker secrets → Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Put ANTHROPIC_API_KEY into the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "GitHub secret ANTHROPIC_API_KEY is empty"; exit 1; }
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.114.0 secret put ANTHROPIC_API_KEY
