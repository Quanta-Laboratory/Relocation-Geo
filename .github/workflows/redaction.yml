name: Matsne Redaction Check

on:
  schedule:
    # Weekly. Times are UTC (GitHub cron is always UTC).
    # 09:00 UTC Monday = 13:00 Tbilisi.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matsne-redaction
  cancel-in-progress: false

jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild source index (doc -> pages)
        run: python scripts/matsne_monitor/source_index.py

      - name: Probe redactions and write report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/matsne_monitor/redaction_check.py

      - name: Commit index, state and report if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/source_index.json 2>/dev/null || true
          git add scripts/matsne_monitor/redaction_state.json 2>/dev/null || true
          git add scripts/matsne_monitor/staleness_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: matsne redaction check update [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
