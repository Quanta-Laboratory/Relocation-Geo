name: Matsne Redaction Check

on:
  schedule:
    # Weekly. Times are UTC (GitHub cron is always UTC).
    # 09:00 UTC Monday = 13:00 Tbilisi.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matsne-redaction
  cancel-in-progress: false

jobs:
  # Skip a late GitHub `schedule:` run when the Cloudflare scheduler
  # (worker/scheduler.ts) already dispatched this workflow on time.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" \
                -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 --jq .total_count || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already dispatched in the last 12 h ($n run(s)) — skipping late scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch — running as fallback."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  redaction:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild source index (doc -> pages)
        run: python scripts/matsne_monitor/source_index.py

      - name: Probe redactions and write report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/matsne_monitor/redaction_check.py

      - name: Commit index, state and report if changed
        run: |
          git config user.name "relocation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/matsne_monitor/source_index.json 2>/dev/null || true
          git add scripts/matsne_monitor/redaction_state.json 2>/dev/null || true
          git add scripts/matsne_monitor/staleness_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: matsne redaction check update [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
